<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keyi's Garden</title>
<meta name="description" content="A garden grown from 100 everyday observations: one flower, one frame, one day.">
<link rel="stylesheet" href="style.css?v=202611171859">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js?v=187",
    "./vendor/three.core.js": "./vendor/three.core.js?v=187",
    "./src/utils.js": "./src/utils.js?v=202611171859",
    "./src/layout.js": "./src/layout.js?v=202611171859",
    "./src/Terrain.js": "./src/Terrain.js?v=202611171859",
    "./src/Atmosphere.js": "./src/Atmosphere.js?v=202611171859",
    "./src/Flower.js": "./src/Flower.js?v=202611171859",
    "./src/FlowerField.js": "./src/FlowerField.js?v=202611171859",
    "./src/CameraController.js": "./src/CameraController.js?v=202611171859",
    "./src/DayOverlay.js": "./src/DayOverlay.js?v=202611171859",
    "./src/ProgressIndicator.js": "./src/ProgressIndicator.js?v=202611171859",
    "./src/ViewSwitcher.js": "./src/ViewSwitcher.js?v=202611171859",
    "./src/GardenScene.js": "./src/GardenScene.js?v=202611171859"
  }
}
</script>
</head>
<body>
<canvas id="gl" aria-label="A 3D garden of 100 flowers, one for each day"></canvas>
<div class="veil" aria-hidden="true"></div>

<header class="title">
  <h1>Keyi's Garden</h1>
  <p>100 days of frames</p>
</header>
<p class="nowday" id="nowday" aria-live="polite"></p>

<p class="hint" id="hint">Scroll to walk deeper &middot; hover a flower &middot; click to enter a day</p>

<nav class="views" id="views" aria-label="Camera view">
  <button data-view="walk" title="Walk through the garden (1)">Explore</button>
  <button data-view="overview" title="Stand on the hill (2)">Overview</button>
  <button data-view="top" title="See all 100 days from above (3)">Bird&rsquo;s eye</button>
</nav>

<nav class="timeline" id="timeline" aria-label="The 100 days">
  <span class="tl-start"></span>
  <div class="tl-track">
    <span class="tl-marker"><b class="tl-now"></b></span>
  </div>
  <span class="tl-end"></span>
</nav>

<div class="tag" id="tag" aria-hidden="true">
  <div class="t-day"></div>
  <div class="t-date"></div>
  <div class="t-title"></div>
</div>

<section class="day" id="day" aria-hidden="true">
  <div class="day-scrim" data-close></div>
  <article class="panel" role="dialog" aria-labelledby="d-day">
    <button class="back" data-close><span>&larr;</span> Back to the garden</button>
    <p class="d-eyebrow" id="d-day"></p>
    <p class="d-date" id="d-date"></p>
    <figure class="d-photo"><img id="d-photo" alt=""></figure>
    <h2 class="d-title" id="d-title"></h2>
    <p class="d-note" id="d-note"></p>
    <div class="d-foot">
      <figure class="d-sketch"><img id="d-sketch" alt="The sketch for this day"><figcaption>The sketch</figcaption></figure>
      <nav class="d-nav">
        <button id="d-prev" aria-label="Previous day"><span>&larr;</span> Previous</button>
        <button id="d-next" aria-label="Next day">Next <span>&rarr;</span></button>
      </nav>
    </div>
  </article>
</section>

<div class="nogl" id="nogl"><p></p></div>

<script src="data.js?v=202611171859"></script>
<script src="config.js?v=202611171859"></script>
<script type="module" src="./src/main.js?v=202611171859"></script>
</body>
</html>
