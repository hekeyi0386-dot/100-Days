<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 Days of Frames</title>
<meta name="description" content="100 small moments, forming one personal sky.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261117a">
</head>
<body>

<!-- the sky -->
<div class="dust" id="dust" aria-hidden="true"></div>
<main class="sky" id="sky" aria-label="100 days, one personal sky">
  <svg class="layer" id="garden" aria-hidden="true"></svg>
  <svg class="layer" id="lines" aria-hidden="true"></svg>
  <div class="bloom" id="bloom" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <g class="petals"></g>
    </svg>
  </div>
</main>
<div class="grain" aria-hidden="true"></div>

<header class="masthead" id="masthead">
  <h1>100 Days <em>of</em> Frames</h1>
  <p class="sub" id="sub"></p>
  <p class="line" id="line"></p>
</header>
<p class="meta" id="meta"></p>
<p class="hint" id="hint"></p>

<div class="card" id="card" aria-hidden="true">
  <div class="c-day"></div>
  <div class="c-date"></div>
  <div class="c-title"></div>
  <div class="c-group"></div>
</div>

<!-- one day -->
<section class="day" id="day" aria-hidden="true">
  <div class="day-backdrop" data-close></div>
  <article class="panel" role="dialog" aria-modal="true" aria-labelledby="d-day">
    <button class="x" data-close aria-label="Close">
      <svg viewBox="0 0 20 20"><path d="M4 4l12 12M16 4L4 16" /></svg>
    </button>
    <svg class="sprig" viewBox="0 0 120 120" aria-hidden="true"></svg>

    <figure class="photo"><img id="d-photo" alt=""></figure>

    <div class="info">
      <p class="d-eyebrow" id="d-day"></p>
      <p class="d-date" id="d-date"></p>
      <h2 class="d-title" id="d-title"></h2>
      <p class="d-note" id="d-note"></p>

      <figure class="d-sketch">
        <img id="d-sketch" alt="The sketch for this day">
        <figcaption>The sketch</figcaption>
      </figure>

      <div class="d-sky">
        <svg id="mini" viewBox="0 0 320 200" aria-label="Where this day sits in the sky"></svg>
        <p id="d-group"></p>
      </div>

      <nav class="d-nav">
        <button id="d-prev" aria-label="Previous day"><span>&larr;</span> Previous</button>
        <button id="d-next" aria-label="Next day">Next <span>&rarr;</span></button>
      </nav>
    </div>
  </article>
</section>

<script src="data.js?v=20261117a"></script>
<script src="config.js?v=20261117a"></script>
<script src="sky.js?v=20261117a"></script>
</body>
</html>
