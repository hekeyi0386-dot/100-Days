<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keyi's Garden</title>
<link rel="stylesheet" href="style.css?v=20261007c">
</head>
<body>
<canvas id="scene"></canvas>
<div class="grain"></div>
<div class="vignette"></div>

<header class="hud-title">
  <h1>Keyi's Garden</h1>
  <p id="count" hidden></p><!-- kept so older cached scripts do not crash -->
</header>

<div class="intro" id="intro">
  <p>Move your mouse to wander the garden</p>
  <p class="sub">Walk close and a flower wakes. Click it to see that day.</p>
</div>

<div class="tip" id="tip"></div>
<div class="cursor" id="cursor"></div>

<nav class="ticks" id="ticks" aria-label="100 days"></nav>

<div class="modal" id="modal" aria-hidden="true">
  <div class="backdrop" data-close></div>
  <article class="card" role="dialog" aria-modal="true">
    <button class="close" data-close aria-label="Close">×</button>
    <div class="pair">
      <figure class="sketch"><img id="m-sketch" alt="Sketch"><figcaption>Sketch</figcaption></figure>
      <figure class="photo"><img id="m-photo" alt="Photo"><figcaption>Reality</figcaption></figure>
    </div>
    <div class="meta">
      <span class="day" id="m-day"></span>
      <h2 id="m-title"></h2>
      <p id="m-caption"></p>
    </div>
    <div class="nav">
      <button id="m-prev" aria-label="Previous">‹</button>
      <button id="m-next" aria-label="Next">›</button>
    </div>
  </article>
</div>

<script src="data.js?v=20261007b"></script>
<script src="garden.js?v=20261007c"></script>
</body>
</html>
