<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 Days Garden</title>
<link rel="stylesheet" href="style.css?v=20261007a">
</head>
<body>
<canvas id="scene"></canvas>
<script data-cfasync="false">
  // If anything fails, say so on the page instead of staying blank.
  (function () {
    function show(m) {
      var d = document.getElementById("err");
      if (!d) { d = document.createElement("pre"); d.id = "err"; d.style.cssText = "position:fixed;left:12px;bottom:56px;max-width:90vw;margin:0;padding:8px 10px;font:12px/1.4 monospace;color:#900;background:rgba(255,255,255,.85);border-radius:8px;white-space:pre-wrap;z-index:99"; document.body.appendChild(d); }
      d.textContent += m + "\n";
    }
    window.__showErr = show;
    window.addEventListener("error", function (e) {
      show(e.target && e.target.src ? "Failed to load: " + e.target.src : "Error: " + e.message + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : ""));
    }, true);
  })();
</script>
<div class="grain"></div>
<div class="vignette"></div>

<header class="hud-title">
  <h1>100 Days Garden</h1>
  <p id="count">0 / 100 in bloom</p>
</header>

<div class="intro" id="intro">
  <p>Move your mouse to wander the garden</p>
  <p class="sub">Walk close and a flower wakes. Click it to see that day.</p>
</div>

<div class="tip" id="tip"></div>
<div class="cursor" id="cursor"></div>

<nav class="ticks" id="ticks" aria-label="100 days"></nav>

<div class="modal" id="modal" aria-hidden="true">
  <div class="backdrop" data-close></div>
  <article class="card" role="dialog" aria-modal="true">
    <button class="close" data-close aria-label="Close">×</button>
    <div class="pair">
      <figure class="sketch"><img id="m-sketch" alt="Sketch"><figcaption>Sketch</figcaption></figure>
      <figure class="photo"><img id="m-photo" alt="Photo"><figcaption>Reality</figcaption></figure>
    </div>
    <div class="meta">
      <span class="day" id="m-day"></span>
      <h2 id="m-title"></h2>
      <p id="m-caption"></p>
    </div>
    <div class="nav">
      <button id="m-prev" aria-label="Previous">‹</button>
      <button id="m-next" aria-label="Next">›</button>
    </div>
  </article>
</div>

<script data-cfasync="false" src="data.js?v=20261007a"></script>
<script data-cfasync="false" src="garden.js?v=20261007a"></script>
<noscript>Please enable JavaScript to enter the garden.</noscript>
</body>
</html>
